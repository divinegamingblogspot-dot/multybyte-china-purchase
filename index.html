<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Multybyte China Purchase">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Multybyte China Purchase</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">MULTYBYTE</div>
      <div class="subtitle">China Purchase</div>
    </div>
    <button id="refreshBtn" class="icon-btn" type="button" aria-label="Refresh">↻</button>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <h1>Purchase List</h1>
        <p id="statusText">Connecting to purchase data…</p>
      </div>
      <div class="count" id="countBadge">0 items</div>
    </section>

    <section class="search-box">
      <input id="searchInput" type="search" placeholder="Search SKU, product or supplier…" autocomplete="off">
      <button id="clearBtn" type="button">Clear</button>
    </section>

    <section id="loading" class="state">Loading products…</section>
    <section id="error" class="state error hidden"></section>
    <section id="empty" class="state hidden">No matching products found.</section>
    <section id="products" class="products"></section>
  </main>

  <template id="productTemplate">
    <article class="card">
      <div class="image-wrap">
        <img class="product-image" alt="Product image" loading="lazy">
        <div class="no-image">NO IMAGE</div>
      </div>
      <div class="card-body">
        <div class="sku"></div>
        <h2 class="product-name"></h2>
        <div class="details">
          <div><span>Quantity</span><strong class="quantity">—</strong></div>
          <div><span>Supplier</span><strong class="supplier">—</strong></div>
        </div>
        <a class="product-link" target="_blank" rel="noopener noreferrer">Open product</a>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
