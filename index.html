<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Multybyte Vendor Portal">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Multybyte Vendor Portal</title>
</head>
<body>
  <header class="topbar">
    <div><div class="brand">MULTYBYTE</div><div class="subtitle">Vendor Portal</div></div>
    <div class="top-actions">
      <span id="vendorBadge" class="vendor-badge hidden"></span>
      <button id="refreshBtn" class="icon-btn hidden" type="button" title="Refresh">↻</button>
      <button id="logoutBtn" class="icon-btn hidden" type="button" title="Log out">↪</button>
    </div>
  </header>

  <main class="container">
    <section id="loginView" class="login-view">
      <div class="login-card">
        <div class="login-logo">MB</div>
        <h1 id="loginTitle">Vendor sign in</h1>
        <p id="loginSubtitle">Sign in to access your assigned products.</p>
        <form id="loginForm" autocomplete="on">
          <label for="loginId">User ID</label>
          <input id="loginId" name="username" type="text" autocomplete="username" placeholder="Enter ID" required>
          <label for="loginPassword">Password</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
          <button class="primary-btn" type="submit">Sign in</button>
          <div id="loginError" class="form-error hidden"></div>
        </form>
        <button id="adminModeBtn" class="text-btn" type="button">Admin login</button>
      </div>
    </section>

    <section id="adminView" class="hidden">
      <div class="admin-head"><div><h1>Admin Dashboard</h1><p>Manage vendors and their assigned sheets.</p></div><button id="adminRefreshBtn" class="secondary-btn">Refresh</button></div>
      <div class="admin-grid">
        <div class="panel">
          <h2>Create / Update Vendor</h2>
          <form id="vendorForm">
            <input id="vendorEditId" type="hidden">
            <label>Vendor ID<input id="vendorIdInput" required placeholder="e.g. sipu"></label>
            <label>Vendor Name<input id="vendorNameInput" required placeholder="e.g. Sipu Cable"></label>
            <label>Password<input id="vendorPasswordInput" type="password" placeholder="Required for new vendor"></label>
            <label>Sheet Name<input id="vendorSheetInput" required placeholder="Exact Google Sheet tab name"></label>
            <label class="check-row"><input id="vendorEnabledInput" type="checkbox" checked> Enabled</label>
            <button class="primary-btn" type="submit">Save Vendor</button>
            <button id="vendorCancelBtn" class="secondary-btn hidden" type="button">Cancel Edit</button>
            <div id="vendorFormMsg" class="form-message"></div>
          </form>
        </div>
        <div class="panel">
          <h2>Vendors</h2>
          <div id="vendorList" class="vendor-list"><div class="state">Loading vendors…</div></div>
        </div>
      </div>
      <button id="adminLogoutBtn" class="danger-btn">Log out</button>
    </section>

    <section id="portalView" class="hidden">
      <section class="hero"><div><h1>Products</h1><p id="statusText">Connecting to product data…</p></div><div class="count" id="countBadge">0 items</div></section>
      <section class="search-box"><input id="searchInput" type="search" placeholder="Search SKU, product, price or remarks…" autocomplete="off"><button id="clearBtn">Clear</button></section>
      <section id="loading" class="state">Loading products…</section>
      <section id="error" class="state error hidden"></section>
      <section id="empty" class="state hidden">No matching products found.</section>
      <section id="products" class="products"></section>
    </section>
  </main>

  <template id="productTemplate">
    <article class="card">
      <div class="image-wrap"><img class="product-image" alt="Product image" loading="lazy"><div class="no-image">NO IMAGE</div></div>
      <div class="card-body">
        <div class="sku"></div><h2 class="product-name"></h2>
        <div class="details">
          <div><span>Quantity</span><strong class="quantity">—</strong></div>
          <div><span>Supplier</span><strong class="supplier">—</strong></div>
          <div><span>Price</span><strong class="price">—</strong></div>
          <div><span>Remarks</span><strong class="remarks">—</strong></div>
        </div>
        <a class="product-link" target="_blank" rel="noopener noreferrer">Open Product</a>
      </div>
    </article>
  </template>
  <script src="app.js"></script>
</body>
</html>
