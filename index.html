<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050914">
<meta name="description" content="Multybyte Website Listing Master">
<link rel="icon" href="icon-192.svg">
<title>Multybyte // Listing Master</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050914;color:#eef5ff;font-family:Inter,Arial,sans-serif}body{background:radial-gradient(circle at 15% 0,#10264b 0,#050914 38%),#050914}.top{position:sticky;top:0;z-index:5;padding:15px 22px;background:#050914ee;border-bottom:1px solid #1a2942;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:2px}.sub{font:8px monospace;color:#71839d;margin-top:3px}.status{font:10px monospace;padding:8px 11px;border:1px solid #1a2942;border-radius:20px;color:#8493ad}.status.live{color:#8df0ad;border-color:#57e38944}.status.error{color:#ff9ab0;border-color:#ff6b8a44}.wrap{max-width:1400px;margin:auto;padding:25px 18px 50px}.head{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:20px}.head h1{font-size:34px;margin:5px 0}.head p{color:#8493ad;margin:0}.tools{display:flex;gap:8px}.tools input,.tools select{background:#07101e;color:#eef5ff;border:1px solid #1a2942;border-radius:10px;padding:11px 12px;outline:0}.tools input{min-width:280px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.metric{padding:14px;border:1px solid #1a2942;border-radius:14px;background:#07101e}.metric span{display:block;font:8px monospace;color:#63758f}.metric strong{display:block;margin-top:6px;font-size:20px}.message{padding:30px;text-align:center;color:#71839d}.error{color:#ff9ab0}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}.card{overflow:hidden;border:1px solid #1a2942;border-radius:16px;background:#08111f}.image{height:230px;background:#07101b;display:flex;align-items:center;justify-content:center;position:relative}.image img{width:100%;height:100%;object-fit:contain;padding:12px}.noimg{display:none;color:#50617b;font:10px monospace}.no-photo img{display:none}.no-photo .noimg{display:block}.active{position:absolute;top:10px;left:10px;color:#8df0ad;background:#57e38918;border:1px solid #57e38940;border-radius:20px;padding:5px 8px;font:8px monospace}.body{padding:15px}.sku{font:10px monospace;color:#83dff1}.name{font-size:16px;line-height:1.35;margin:9px 0 13px}.details{display:grid;grid-template-columns:1fr 1fr;gap:7px}.detail{padding:8px;border:1px solid #ffffff08;border-radius:9px;background:#ffffff03}.detail span{display:block;font:7px monospace;color:#62738b;margin-bottom:4px}.detail b{font-size:11px;word-break:break-word}.link{display:block;text-align:center;margin-top:12px;padding:10px;border:1px solid #63e6ff20;border-radius:9px;color:#a9f3ff;text-decoration:none;font-weight:800;font-size:11px}.footer{text-align:center;color:#52637a;font:8px monospace;padding:20px}.hidden{display:none!important}@media(max-width:700px){.head{display:block}.tools{margin-top:15px}.tools input{min-width:0;width:100%}.tools select{width:100%}.metrics{grid-template-columns:1fr}.head h1{font-size:28px}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">MULTYBYTE</div><div class="sub">WEBSITE LISTING MASTER</div></div><div id="connection" class="status">CONNECTING</div></header>
<main class="wrap">
<section class="head"><div><div class="sub">WEBSITE LISTING // MASTER CATALOG</div><h1>Active Products</h1><p>Live products from the Website Listing spreadsheet.</p></div><div class="tools"><input id="searchInput" type="search" placeholder="Search SKU, product, supplier…"><select id="sortSelect"><option value="default">SKU</option><option value="name">Product</option><option value="supplier">Supplier</option><option value="price">Landing Cost</option></select></div></section>
<section class="metrics"><div class="metric"><span>ACTIVE PRODUCTS</span><strong id="metricSkus">0</strong></div><div class="metric"><span>SUPPLIERS</span><strong id="metricSuppliers">0</strong></div><div class="metric"><span>SYNC</span><strong id="metricSync">—</strong></div></section>
<div id="catalogStatus" class="message">Loading Website Listing…</div>
<section id="error" class="message error hidden"></section>
<section id="products" class="products"></section>
<template id="productTemplate"><article class="card"><div class="image"><img class="product-image" loading="lazy" alt="Product image"><div class="noimg">NO IMAGE</div><span class="active">ACTIVE</span></div><div class="body"><div class="sku"></div><div class="name"></div><div class="details"><div class="detail"><span>SUPPLIER</span><b class="supplier">—</b></div><div class="detail"><span>LANDING COST</span><b class="price">—</b></div><div class="detail"><span>SKU</span><b class="sku2">—</b></div><div class="detail"><span>REMARKS</span><b class="remarks">—</b></div></div><a class="link" target="_blank" rel="noopener noreferrer">Open Product ↗</a></div></article></template>
</main><footer class="footer">MULTYBYTE • Website Listing Master</footer>
<script src="app.js?v=listing-master-2"></script>
</body>
</html>
