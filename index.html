<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e31e24"><title>Multybyte // Website Listing Master</title><link rel="icon" href="icon-192.svg">
<style>
:root{--red:#e31e24;--red2:#b51218;--navy:#10131a;--ink:#171a21;--panel:#fff;--line:#e5e7eb;--muted:#697386;--bg:#f5f6f8;--ok:#16834a;--warn:#b77900;--danger:#c62828;--shadow:0 8px 28px rgba(16,19,26,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,Arial,sans-serif}.hidden{display:none!important}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:3px solid var(--red);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:950;letter-spacing:2.5px;font-size:19px}.sub{font:10px monospace;color:#aeb6c4;letter-spacing:.6px}.status{padding:7px 11px;border:1px solid #3a414d;border-radius:999px;font:10px monospace}.live{color:#8af0b5;border-color:#276f49}.wrap{max-width:1600px;margin:auto;padding:22px 18px 60px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:15px;box-shadow:var(--shadow)}.login{max-width:450px;margin:8vh auto}.h{font-size:30px;font-weight:900;margin:5px 0 18px}.tabs,.tools,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.input,select,.btn{background:#fff;color:var(--ink);border:1px solid #cfd4dc;border-radius:9px;padding:10px 12px}.input:focus,select:focus{outline:2px solid #e31e2430;border-color:var(--red)}.input{width:100%}.btn{cursor:pointer;font-weight:800}.btn:hover{border-color:var(--red)}.primary{background:var(--red);color:#fff;border-color:var(--red)}.primary:hover{background:var(--red2);border-color:var(--red2)}.dangerBtn{color:#fff;background:#b91c1c;border-color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 5px 18px rgba(16,19,26,.06)}.photo{height:190px;background:#fafafa;display:flex;align-items:center;justify-content:center;color:#929aa7;border-bottom:1px solid var(--line);position:relative}.photo img{width:100%;height:100%;object-fit:contain;padding:12px}.photo .loading{font:10px monospace;color:#9aa1ad}.body{padding:14px}.sku{font:10px monospace;color:var(--red);font-weight:800}.name{font-size:16px;font-weight:850;margin:7px 0 12px;min-height:38px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px}.meta div{padding:8px;background:#f8f9fb;border:1px solid #edf0f3;border-radius:8px}.meta small{display:block;color:var(--muted);font:8px monospace}.meta b{font-size:11px;word-break:break-word}.actions{margin-top:11px}.actions>*{flex:1;text-align:center;text-decoration:none}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:15px}.metric{padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow)}.metric span{display:block;color:var(--muted);font:9px monospace;font-weight:800}.metric b{display:block;font-size:22px;margin-top:5px}.healthbar{height:7px;background:#e9edf2;border-radius:9px;overflow:hidden;margin-top:8px}.healthbar i{display:block;height:100%;background:var(--ok);width:0}.state{padding:28px;text-align:center;color:var(--muted)}.danger{color:var(--danger)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:middle}.table th{background:#fafafa;position:sticky;top:0;z-index:1}.scroll{overflow:auto}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.sectionTitle h2,.sectionTitle h3{margin:0}.check{width:18px;height:18px;accent-color:var(--red)}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#f2f3f5;font:9px monospace}.pill.ok{color:var(--ok);background:#eaf8f0}.pill.bad{color:var(--danger);background:#fff0f0}.modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;padding:15px}.modalBox{width:min(900px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:15px;padding:18px;box-shadow:0 20px 70px #0005}.poItems{margin-top:12px}.poRow{display:grid;grid-template-columns:1fr 100px 42px;gap:7px;margin-bottom:7px;align-items:center}.toast{position:fixed;right:18px;bottom:18px;z-index:80;background:var(--navy);color:#fff;padding:12px 15px;border-radius:10px;box-shadow:var(--shadow);max-width:360px}.adminToolbar{display:grid;grid-template-columns:1fr 180px 150px auto auto auto;gap:8px}.brandline{display:flex;align-items:center;gap:12px}.logoDot{width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px #e31e2420}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.adminToolbar{grid-template-columns:1fr 1fr}.adminToolbar .input{grid-column:1/-1}}@media(max-width:650px){.metrics{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.top{padding:11px 12px}.wrap{padding:13px 9px 40px}.h{font-size:25px}.poRow{grid-template-columns:1fr 80px 42px}}
</style></head>
<body>
<header class="top"><div class="brandline"><i class="logoDot"></i><div><div class="brand">MULTYBYTE</div><div class="sub">WEBSITE LISTING MASTER</div></div></div><div><span id="connection" class="status">OFFLINE</span> <button id="logout" class="btn hidden">Logout</button></div></header>
<main class="wrap">
<section id="loginPanel" class="panel login"><div class="sub">SECURE ACCESS</div><div class="h">Listing Portal</div><div class="tabs"><button class="btn primary" id="vendorRole">Vendor</button><button class="btn" id="adminRole">Admin</button></div><br><input id="loginId" class="input" placeholder="Login ID" autocomplete="username"><br><br><input id="loginPassword" class="input" type="password" placeholder="Password" autocomplete="current-password"><br><br><button id="loginBtn" class="btn primary" style="width:100%">Sign in</button><div id="loginMsg" class="state"></div></section>
<section id="portal" class="hidden"><section class="panel"><div class="sub">LIVE SESSION</div><div class="h" id="welcome">Portal</div><div id="vendorIdentity" class="sub"></div></section>
<section id="vendorView" class="hidden"><div id="vendorStats" class="metrics"></div><div class="panel"><div class="tools"><input id="vendorSearch" class="input" style="max-width:500px" placeholder="Search SKU, product, supplier…"><select id="vendorSort"><option value="sku">SKU</option><option value="name">Product</option><option value="supplier">Supplier</option><option value="price">Price</option></select><button id="vendorRefresh" class="btn">Refresh</button><button id="vendorPdf" class="btn">PDF Selected</button><button id="vendorCsv" class="btn">CSV</button></div></div><div id="vendorProducts" class="grid"></div><div class="panel"><div class="sectionTitle"><h3>Purchase Orders</h3></div><div id="vendorPO" class="scroll"></div></div></section>
<section id="adminView" class="hidden"><div id="adminStats" class="metrics"></div><div class="panel"><div class="tabs"><button id="adminProductsBtn" class="btn primary">Products</button><button id="adminVendorsBtn" class="btn">Vendors</button><button id="adminPOBtn" class="btn">Purchase Orders</button><button id="adminRefresh" class="btn">Refresh</button></div></div>
<div id="adminProductsSection"><div class="panel"><div class="adminToolbar"><input id="adminSearch" class="input" placeholder="Search SKU, product, supplier, vendor…"><select id="adminVendorFilter"><option value="">All vendors</option></select><select id="adminStatusFilter"><option value="Active">Active</option><option value="">All statuses</option><option value="Inactive">Inactive</option><option value="Pending">Pending</option></select><button id="adminSelectAll" class="btn">Select All</button><button id="adminPdf" class="btn">PDF Selected</button><button id="adminCsv" class="btn">CSV</button></div><div id="adminProductList" class="grid" style="margin-top:14px"></div></div></div>
<div id="adminVendorsSection" class="hidden"><div class="panel"><div class="sectionTitle"><h3>Vendor Accounts</h3></div><div class="tools"><input id="newVendorId" class="input" placeholder="Login ID"><input id="newVendorName" class="input" placeholder="Vendor name"><input id="newVendorPassword" class="input" type="password" placeholder="Password"><button id="saveVendor" class="btn primary">Create / Update Vendor</button></div><br><div id="vendorList" class="scroll"></div></div></div>
<div id="adminPOSection" class="hidden"><div class="panel"><div class="sectionTitle"><h3>Purchase Orders</h3><button id="createPO" class="btn primary">+ Create PO</button></div><div id="adminPO" class="scroll"></div></div></div></section></section></main>
<div id="poModal" class="modal hidden"><div class="modalBox"><div class="sectionTitle"><h2>Create Purchase Order</h2><button id="poClose" class="btn">Close</button></div><div class="tools"><select id="poVendor" class="input"><option value="">Select vendor</option></select><input id="poSku" class="input" placeholder="Enter SKU and add"><button id="poAdd" class="btn primary">Add SKU</button></div><div id="poLookup" class="state"></div><div id="poItems" class="poItems"></div><div class="actions" style="margin-top:15px"><button id="poCreate" class="btn primary">Create PO</button></div></div></div><div id="toast" class="toast hidden"></div>
<script src="app.js?v=listing-master-final-1"></script></body></html>
