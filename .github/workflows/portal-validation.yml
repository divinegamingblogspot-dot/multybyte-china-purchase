name: Portal Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check portal scripts
        run: |
          set -e
          for f in app.js admin-products.js admin-enhancements.js portal-upgrades.js login-side-ultra.js procurement-upgrades.js; do
            echo "Checking $f"
            node --check "$f"
          done
