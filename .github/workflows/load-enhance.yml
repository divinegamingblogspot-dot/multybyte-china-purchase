name: Load portal enhancements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add enhancement script to portal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="enhance.js?v=image-vendor-pdf-1" defer></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Load safe portal image vendor PDF enhancements' && git push)
