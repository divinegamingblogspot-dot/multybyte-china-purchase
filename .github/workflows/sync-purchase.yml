name: Sync China Purchase Data

on:
  workflow_dispatch:
  push:
    paths:
      - 'data.json'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  sync:
    # Apps Script pushes data.json -> this workflow immediately caches the images.
    # The workflow's own commit is ignored so it cannot loop forever.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch purchase data and cache images
        env:
          API_URL: https://script.google.com/macros/s/AKfycbwDHq7TB9vSxTlSeG9i55HyuhPzAP8oryRWdLsKhPZVHQubgdIAs8CJ7sknQTJLmabj/exec?action=data
        run: |
          python - <<'PY'
          import json, os, re, hashlib, mimetypes, pathlib, time, urllib.request

          api = os.environ['API_URL']

          def fetch_api():
              last_error = None
              for attempt in range(1, 6):
                  try:
                      req = urllib.request.Request(
                          api + '&_=' + str(time.time_ns()),
                          headers={'User-Agent': 'Multybyte-China-Purchase-Sync/4.0', 'Cache-Control': 'no-cache'}
                      )
                      with urllib.request.urlopen(req, timeout=45) as r:
                          raw = r.read().decode('utf-8-sig').strip()
                      print('API attempt', attempt, 'bytes:', len(raw))
                      if raw.startswith('{'):
                          payload = json.loads(raw)
                      else:
                          start, end = raw.find('('), raw.rfind(')')
                          if start < 0 or end <= start:
                              raise RuntimeError('Apps Script did not return valid JSON/JSONP')
                          payload = json.loads(raw[start + 1:end])
                      if not payload.get('success') or not isinstance(payload.get('data'), list):
                          raise RuntimeError('Invalid purchase data returned by Apps Script')
                      return payload
                  except Exception as exc:
                      last_error = exc
                      print(f'API attempt {attempt}/5 failed: {exc}')
                      if attempt < 5:
                          time.sleep(attempt * 3)
              raise RuntimeError(f'Apps Script API failed after 5 attempts: {last_error}')

          payload = fetch_api()
          pathlib.Path('images').mkdir(exist_ok=True)

          def clean_url(value):
              if not value:
                  return ''
              value = str(value).strip().replace('\\u0026', '&').replace('&amp;', '&')
              if value.startswith('//'):
                  value = 'https:' + value
              return value if re.match(r'^https?://', value, re.I) else ''

          def extension(url, content_type):
              path = url.split('?', 1)[0].lower()
              for ext in ('.webp', '.jpg', '.jpeg', '.png', '.gif'):
                  if path.endswith(ext):
                      return ext
              ext = mimetypes.guess_extension(content_type.split(';')[0].strip()) if content_type else None
              return ext if ext in ('.webp', '.jpg', '.jpeg', '.png', '.gif') else '.jpg'

          products = []
          for item in payload['data']:
              p = dict(item)
              source_image = clean_url(p.get('image'))
              if source_image:
                  try:
                      image_req = urllib.request.Request(
                          source_image,
                          headers={'User-Agent': 'Mozilla/5.0', 'Cache-Control': 'no-cache'}
                      )
                      with urllib.request.urlopen(image_req, timeout=45) as r:
                          content_type = r.headers.get('Content-Type', '')
                          body = r.read()
                          ext = extension(source_image, content_type)

                      image_hash = hashlib.sha256(body).hexdigest()[:20]
                      filename = f'images/{image_hash}{ext}'
                      with open(filename, 'wb') as f:
                          f.write(body)

                      # Keep every product image on GitHub Pages itself.
                      # This avoids external CDN dependence, especially in China.
                      p['image'] = './' + filename
                  except Exception as exc:
                      print(f'Image cache failed for {source_image}: {exc}')
                      # Do not destroy the image field if the CDN temporarily fails.
                      # The existing value remains usable as a fallback.
                      p['image'] = source_image
              else:
                  p['image'] = ''
              products.append(p)

          output = {
              'success': True,
              'updated': payload.get('updated'),
              'data': products
          }

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, separators=(',', ':'))
              f.write('\n')

          print('SYNC SUCCESS - Sheet updated:', payload.get('updated'), '- Products:', len(products))
          PY

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json images/
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Auto-sync China purchase data and local images'
          git push
