name: Sync China Purchase Data

on:
  workflow_dispatch:
  push:
    paths:
      - 'data.json'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

# Never run two sync jobs at the same time.
concurrency:
  group: china-purchase-sync
  cancel-in-progress: false

jobs:
  sync:
    # A data.json push from Apps Script must run immediately.
    # Ignore only commits created by this workflow itself.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync data and cache images
        env:
          API_URL: https://script.google.com/macros/s/AKfycbwDHq7TB9vSxTlSeG9i55HyuhPzAP8oryRWdLsKhPZVHQubgdIAs8CJ7sknQTJLmabj/exec?action=data
        run: |
          python - <<'PY'
          import json, os, re, hashlib, mimetypes, pathlib, time, urllib.request

          api = os.environ['API_URL']

          def parse_payload(raw):
              raw = raw.decode('utf-8-sig').strip() if isinstance(raw, bytes) else raw.strip()
              if raw.startswith('{'):
                  return json.loads(raw)
              start, end = raw.find('('), raw.rfind(')')
              if start < 0 or end <= start:
                  raise RuntimeError('Apps Script did not return valid JSON/JSONP')
              return json.loads(raw[start + 1:end])

          def fetch_api():
              last_error = None
              for attempt in range(1, 6):
                  try:
                      req = urllib.request.Request(
                          api + '&_=' + str(time.time_ns()),
                          headers={
                              'User-Agent': 'Multybyte-China-Purchase-Sync/5.0',
                              'Cache-Control': 'no-cache',
                              'Pragma': 'no-cache'
                          }
                      )
                      with urllib.request.urlopen(req, timeout=45) as r:
                          payload = parse_payload(r.read())
                      if not payload.get('success') or not isinstance(payload.get('data'), list):
                          raise RuntimeError('Invalid purchase data returned by Apps Script')
                      print('API sync successful on attempt', attempt, '- products:', len(payload['data']))
                      return payload
                  except Exception as exc:
                      last_error = exc
                      print(f'API attempt {attempt}/5 failed: {exc}')
                      if attempt < 5:
                          time.sleep(attempt * 3)
              raise RuntimeError(f'Apps Script API failed after 5 attempts: {last_error}')

          # IMPORTANT:
          # - push event = Apps Script already wrote data.json, so use that exact data.
          # - schedule/manual = refresh from Apps Script API.
          # This removes the old race where a push-triggered workflow immediately
          # re-fetched a slightly older Apps Script response and overwrote new data.
          event = os.environ.get('GITHUB_EVENT_NAME', '')
          current = None
          if pathlib.Path('data.json').exists():
              try:
                  with open('data.json', 'r', encoding='utf-8') as f:
                      current = json.load(f)
              except Exception:
                  current = None

          if event == 'push' and current and current.get('success') is True and isinstance(current.get('data'), list):
              payload = current
              print('PUSH EVENT: using the already-pushed data.json; no API re-fetch.')
          else:
              payload = fetch_api()
              print('API EVENT: refreshed data.json from Apps Script.')

          # Preserve already-cached local images by SKU if a temporary image fetch fails.
          old_by_sku = {}
          if current and isinstance(current.get('data'), list):
              for item in current['data']:
                  sku = str(item.get('sku', '')).strip()
                  image = str(item.get('image', '')).strip()
                  if sku and image.startswith('./images/'):
                      old_by_sku[sku] = image

          pathlib.Path('images').mkdir(exist_ok=True)

          def clean_url(value):
              if not value:
                  return ''
              value = str(value).strip().replace('\\u0026', '&').replace('&amp;', '&')
              if value.startswith('//'):
                  value = 'https:' + value
              return value if re.match(r'^https?://', value, re.I) else ''

          def extension(url, content_type):
              path = url.split('?', 1)[0].lower()
              for ext in ('.webp', '.jpg', '.jpeg', '.png', '.gif'):
                  if path.endswith(ext):
                      return ext
              ext = mimetypes.guess_extension(content_type.split(';')[0].strip()) if content_type else None
              return ext if ext in ('.webp', '.jpg', '.jpeg', '.png', '.gif') else '.jpg'

          products = []
          for item in payload['data']:
              p = dict(item)
              sku = str(p.get('sku', '')).strip()
              source_image = clean_url(p.get('image'))

              if source_image:
                  try:
                      image_req = urllib.request.Request(
                          source_image,
                          headers={
                              'User-Agent': 'Mozilla/5.0',
                              'Accept': 'image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
                              'Cache-Control': 'no-cache'
                          }
                      )
                      with urllib.request.urlopen(image_req, timeout=45) as r:
                          content_type = r.headers.get('Content-Type', '')
                          body = r.read()

                      if not body:
                          raise RuntimeError('Image response was empty')

                      image_hash = hashlib.sha256(body).hexdigest()[:20]
                      filename = f'images/{image_hash}{extension(source_image, content_type)}'
                      with open(filename, 'wb') as f:
                          f.write(body)

                      p['image'] = './' + filename
                      print('IMAGE OK:', sku, '->', p['image'])
                  except Exception as exc:
                      # NEVER replace a known-good GitHub Pages image with an external
                      # CDN URL. Keep the old local image whenever possible.
                      if sku in old_by_sku and pathlib.Path(old_by_sku[sku].lstrip('./')).exists():
                          p['image'] = old_by_sku[sku]
                          print('IMAGE FALLBACK:', sku, 'kept', p['image'], '-', exc)
                      else:
                          p['image'] = source_image
                          print('IMAGE NO CACHE:', sku, '-', exc)
              else:
                  p['image'] = old_by_sku.get(sku, '')

              products.append(p)

          output = {
              'success': True,
              'updated': payload.get('updated'),
              'data': products
          }

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, separators=(',', ':'))
              f.write('\n')

          print('SYNC SUCCESS - updated:', payload.get('updated'), '- products:', len(products))
          PY

      - name: Commit updated data and images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json images/
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Auto-sync China purchase data and local images'
          git push
