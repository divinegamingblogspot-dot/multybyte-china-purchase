name: Remove legacy China Purchase backend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch all frontend API calls to Website Listing
        shell: bash
        run: |
          OLD='https://script.google.com/macros/s/AKfycbwDHq7TB9vSxTlSeG9i55HyuhPzAP8oryRWdLsKhPZVHQubgdIAs8CJ7sknQTJLmabj/exec'
          NEW='https://script.google.com/macros/s/AKfycbxc49T5iqv7V5XvZZciOyaW6a4_CGhjy6hjuxVwHehE8bOX8SGlTL-RJnbC4xpafWWx/exec'
          for f in app.js admin-products.js procurement-revamp.js; do
            [ -f "$f" ] && sed -i "s|$OLD|$NEW|g" "$f"
          done
          if [ -f index.html ]; then
            sed -i '/api-bridge\.js/d' index.html
            sed -i 's|sw\.js?v=15|sw.js?v=16|g' index.html
          fi
      - name: Remove legacy backend and static China Purchase snapshot
        shell: bash
        run: |
          rm -rf apps-script
          rm -f data.json api-bridge.js sw.js
      - name: Remove legacy references from documentation
        shell: bash
        run: |
          if [ -f README.md ]; then
            sed -i 's/China Purchase/Website Listing/g; s/China Purchase backend/Website Listing backend/g' README.md
          fi
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No legacy files or URLs remain to clean.'
            exit 0
          fi
          git commit -m 'Remove China Purchase backend and use Website Listing API'
          git push
