name: Final legacy cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove all remaining legacy purchase assets
        shell: bash
        run: |
          rm -rf images apps-script
          rm -f data.json api-bridge.js sw.js
          rm -f .github/workflows/sync-purchase.yml
          rm -f .github/workflows/remove-legacy-china-purchase.yml
          if [ -f README.md ]; then
            sed -i '/data\.json/d; /apps-script\/Code\.gs/d; /China Purchase/d' README.md || true
          fi
      - name: Commit final cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove all legacy China Purchase assets' || true
          git push